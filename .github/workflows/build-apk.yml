name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare www web bundle
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.json sw.js www/

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android platform & sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK (Installable directly on Android)
        run: |
          # Increment versionCode on every workflow run so Android accepts in-place updates
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCC-Tracker-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
